// Executed once when a CONVERTED R2 map finishes loading (client signon state 8). Look settings measured against R2 frames (LookTune, maps/postfx/LOOK-TUNING.md).
// Settings read at shader creation (r2port_sso, R2_LM_BICUBIC, r2port_ao_tech startup parts) are not affected here.
r2port_display_curve 0.5
mat_sun_scale 1.3
mat_sky_scale 1.6
mat_envmap_scale 1
mat_monitorgamma_tv_enabled 0
r2port_sharpen_amount 0.5
r2port_sharpen_denoise 0.5
r2port_sharpen_width 1
